<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B0C0E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Grizzly" />
<meta name="application-name" content="Project Grizzly" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="favicon-32.png" />
<title>Project Grizzly — Operator: David Devitt</title>
<style>
/* ============================================================
   PROJECT GRIZZLY — Forged. Powerful. Unbreakable.
   Steel-black industrial operating system. Committed dark world
   (Rogue / First Form aesthetic), Devitt purple + teal accents.
   ============================================================ */
:root{
  --steel:#0B0C0E;        /* ground */
  --char:#141619;         /* charcoal */
  --panel:#1B1E23;        /* raised panel */
  --panel-2:#23272E;      /* higher panel / inputs */
  --line:#2C313A;         /* hairlines */
  --line-soft:#22262d;
  --ink:#F4F6F8;          /* primary text */
  --ink-2:#AEB6C0;        /* secondary */
  --mute:#6E7783;         /* muted / labels */
  --purple:#8B5CF6;       /* grizzly purple (identity) */
  --purple-dim:#6D45D6;
  --teal:#2DD4BF;         /* teal (data / positive) */
  --teal-dim:#159e8d;
  --good:#3FB950;         /* back-safe green */
  --warn:#E3A008;         /* caution amber */
  --bad:#F0553B;          /* avoid red */
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 14px 34px -18px rgba(0,0,0,.9);
  --r:14px; --r-sm:10px;
  --disp:"Helvetica Neue Condensed","Arial Narrow",Impact,"Helvetica Neue",Arial,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 620px at 50% -12%, #191c22 0%, rgba(25,28,34,0) 60%),
    var(--steel);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  line-height:1.5;
  overscroll-behavior-y:none;
  padding-bottom:calc(78px + var(--safe-b));
}
::selection{background:rgba(139,92,246,.35)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:var(--teal);text-decoration:none}
h1,h2,h3,h4{margin:0}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---- typographic system ---- */
.display{
  font-family:var(--disp);
  text-transform:uppercase;
  letter-spacing:.02em;
  font-weight:700;
  line-height:.92;
}
.eyebrow{
  font-family:var(--disp);
  text-transform:uppercase;
  letter-spacing:.22em;
  font-weight:700;
  font-size:11px;
  color:var(--mute);
}
.label{
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mute);font-weight:700;
}

/* ---- top bar ---- */
header.top{
  position:sticky;top:0;z-index:40;
  padding:calc(10px + var(--safe-t)) 18px 12px;
  background:linear-gradient(180deg, rgba(11,12,14,.96) 55%, rgba(11,12,14,0));
  backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:12px;
}
.mark{width:36px;height:36px;flex:0 0 auto;border-radius:9px;object-fit:cover;border:1px solid rgba(255,255,255,.08);box-shadow:0 2px 10px -2px rgba(45,212,191,.35), 0 2px 8px -2px rgba(139,92,246,.35)}
.top .titles{display:flex;flex-direction:column;line-height:1;gap:3px;min-width:0}
.top .titles .t1{font-family:var(--disp);text-transform:uppercase;font-weight:700;font-size:19px;letter-spacing:.03em}
.top .titles .t1 b{color:var(--purple)}
.top .titles .t2{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:700}
.top .op{margin-left:auto;text-align:right;line-height:1.1}
.top .op .n{font-family:var(--disp);font-size:22px;font-weight:700;color:var(--teal)}
.top .op .l{font-size:9px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase;font-weight:700}

/* ---- layout ---- */
main{max-width:560px;margin:0 auto;padding:6px 16px 30px;animation:fade .32s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main{animation:none}*{scroll-behavior:auto!important}}

.section-h{display:flex;align-items:baseline;gap:10px;margin:22px 2px 12px}
.section-h h2{font-family:var(--disp);text-transform:uppercase;font-weight:700;font-size:16px;letter-spacing:.06em}
.section-h .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

.card{
  background:linear-gradient(180deg,var(--panel),#171a1e);
  border:1px solid var(--line-soft);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  padding:16px;
}
.card + .card{margin-top:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}

/* ---- hero weight ---- */
.hero{position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:
  radial-gradient(520px 220px at 88% -40%, rgba(139,92,246,.20), transparent 60%),
  radial-gradient(420px 200px at 8% 130%, rgba(45,212,191,.12), transparent 60%);
  pointer-events:none}
.hero .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;position:relative}
.hero .big{font-family:var(--disp);font-weight:700;font-size:74px;line-height:.82;letter-spacing:-.01em}
.hero .big small{font-size:22px;color:var(--ink-2);margin-left:4px}
.hero .avg{text-align:right}
.hero .avg .v{font-family:var(--disp);font-size:34px;font-weight:700;color:var(--teal);line-height:1}
canvas.spark{width:100%;height:74px;display:block;margin-top:12px}

/* trend chip */
.trend{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
.trend.dn{color:var(--teal);background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.3)}
.trend.up{color:var(--warn);background:rgba(227,160,8,.1);border:1px solid rgba(227,160,8,.28)}
.trend.flat{color:var(--ink-2);background:rgba(255,255,255,.05);border:1px solid var(--line)}

/* progress bar */
.pbar{height:9px;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line-soft)}
.pbar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--purple),var(--teal))}

/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--char);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:12px 13px}
.tile .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
.tile .v{font-family:var(--disp);font-size:28px;font-weight:700;margin-top:5px;line-height:1}
.tile .v small{font-size:13px;color:var(--ink-2)}
.tile .sub{font-size:11px;color:var(--mute);margin-top:2px}
.tile .v.teal{color:var(--teal)} .tile .v.purple{color:var(--purple)}

/* mission list / checklist */
.check{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line-soft)}
.check:first-child{border-top:0}
.check .box{
  width:26px;height:26px;flex:0 0 auto;border-radius:8px;border:1.5px solid var(--line);
  background:var(--panel-2);display:grid;place-items:center;transition:.15s;color:transparent;font-weight:900;font-size:15px
}
.check.on .box{background:linear-gradient(180deg,var(--purple),var(--purple-dim));border-color:transparent;color:#fff}
.check .tx{flex:1;min-width:0}
.check .tx .m{font-weight:600;font-size:14.5px}
.check.on .tx .m{color:var(--ink-2)}
.check .tx .d{font-size:11.5px;color:var(--mute);margin-top:1px}
.check .meta{font-size:11px;color:var(--mute);text-align:right;flex:0 0 auto}

/* buttons */
.btn{
  -webkit-appearance:none;appearance:none;border:1px solid var(--line);
  background:var(--panel-2);color:var(--ink);border-radius:11px;
  padding:12px 16px;font-weight:700;font-size:14px;letter-spacing:.02em;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  transition:transform .06s ease, background .15s, border-color .15s;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(180deg,var(--purple),var(--purple-dim));border-color:transparent;color:#fff;box-shadow:0 8px 22px -12px rgba(139,92,246,.9)}
.btn.teal{background:linear-gradient(180deg,var(--teal),var(--teal-dim));border-color:transparent;color:#04231f}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;font-size:12.5px;width:auto;border-radius:9px}
.btn:disabled{opacity:.45}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > .label{margin-left:1px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  -webkit-appearance:none;appearance:none;
  background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
  color:var(--ink);padding:12px 12px;font-size:16px;width:100%;transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(139,92,246,.18)}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input::placeholder,textarea::placeholder{color:#565f6b}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.inline{display:flex;gap:8px;align-items:center}
.inline input{text-align:center}

/* stepper for weigh-in */
.stepper{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel-2)}
.stepper button{width:64px;background:var(--char);border:0;color:var(--ink);font-size:30px;font-weight:300;line-height:1}
.stepper button:active{background:var(--panel)}
.stepper input{border:0;border-radius:0;background:transparent;text-align:center;font-family:var(--disp);font-size:42px;font-weight:700;padding:14px 0}
.stepper input:focus{box-shadow:none}

/* set logger rows */
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 58px 34px;gap:8px;align-items:center;margin-top:8px}
.setrow .sn{font-family:var(--disp);font-size:16px;color:var(--mute);text-align:center;font-weight:700}
.setrow input{padding:10px 6px;text-align:center;font-size:15px}
.setrow .kill{background:transparent;border:0;color:var(--mute);font-size:18px;padding:0}
.setrow .rpe{padding:10px 4px}
.exhead{display:flex;align-items:center;gap:10px}
.exhead .nm{font-weight:700;font-size:15.5px;flex:1}
.exhead .scheme{font-size:11px;color:var(--mute);font-weight:600}
.prev{font-size:11px;color:var(--mute);margin-top:3px}
.pr-flag{color:var(--teal);font-weight:800;font-size:11px;letter-spacing:.04em}

/* back-safety dot */
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block}
.dot.g{background:var(--good);box-shadow:0 0 8px rgba(63,185,80,.5)}
.dot.y{background:var(--warn);box-shadow:0 0 8px rgba(227,160,8,.5)}
.dot.r{background:var(--bad);box-shadow:0 0 8px rgba(240,85,59,.5)}
.rat-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-2)}
.rat-legend span{display:inline-flex;align-items:center;gap:6px}

/* pills / day selector */
.days{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;padding:9px 13px;border-radius:11px;border:1px solid var(--line);background:var(--char);text-align:center;min-width:52px}
.day .dn{font-family:var(--disp);font-size:13px;font-weight:700;letter-spacing:.05em}
.day .dl{font-size:9px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.day.on{background:linear-gradient(180deg,var(--purple),var(--purple-dim));border-color:transparent}
.day.on .dl{color:rgba(255,255,255,.85)}
.day.today{border-color:var(--teal)}

/* measurement grid */
.meas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meas .field .label{display:flex;align-items:center;gap:6px}

/* handbook */
.book h3{font-family:var(--disp);text-transform:uppercase;font-size:17px;letter-spacing:.05em;margin-bottom:8px}
.book p{color:var(--ink-2);font-size:14px;margin:0 0 10px}
.rule-item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line-soft)}
.rule-item:first-child{border-top:0}
.rule-item .num{font-family:var(--disp);font-size:26px;font-weight:700;color:var(--purple);line-height:1;min-width:30px}
.rule-item .b{font-weight:700;font-size:14.5px}
.rule-item .s{font-size:12.5px;color:var(--mute);margin-top:2px}
.road{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line-soft)}
.road:first-child{border-top:0}
.road .wk{font-family:var(--disp);font-size:12px;font-weight:700;color:var(--teal);min-width:64px;padding-top:2px;letter-spacing:.03em}
.road .b{font-weight:700;font-size:14px}
.road .s{font-size:12px;color:var(--mute);margin-top:1px}
.exlib{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.exlib:first-child{border-top:0}
.exlib .nm{flex:1}
.exlib .tag{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--mute)}
.aisle{margin-top:6px}
.aisle .a-h{font-family:var(--disp);font-size:13px;letter-spacing:.08em;color:var(--purple);margin:14px 0 6px;text-transform:uppercase}
.aisle .a-h:first-child{margin-top:0}
.groc{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line-soft);font-size:14px}
.meal{padding:12px 0;border-top:1px solid var(--line-soft)}
.meal:first-child{border-top:0}
.meal .mh{display:flex;justify-content:space-between;align-items:baseline}
.meal .mt{font-weight:700;font-size:14.5px}
.meal .mtime{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.04em}
.meal .mi{font-size:13px;color:var(--ink-2);margin-top:4px}
.meal .mm{font-size:11px;color:var(--teal);margin-top:5px;font-weight:700;letter-spacing:.03em}

/* macro rings row */
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.macro .ring{position:relative;width:100%;aspect-ratio:1;max-width:74px;margin:0 auto}
.macro .ring canvas{width:100%;height:100%}
.macro .ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.macro .ring .c b{font-family:var(--disp);font-size:17px;font-weight:700;line-height:1}
.macro .ring .c s{font-size:9px;color:var(--mute);text-decoration:none;display:block}
.macro .nm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-top:6px}

/* bottom nav */
nav.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  padding:8px 8px calc(8px + var(--safe-b));
  background:linear-gradient(0deg, rgba(11,12,14,.98) 60%, rgba(11,12,14,.86));
  border-top:1px solid var(--line-soft);
  backdrop-filter:blur(12px);
  display:flex;justify-content:space-between;max-width:560px;margin:0 auto;
}
nav.dock button{
  background:none;border:0;color:var(--mute);flex:1;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px;
  font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  transition:color .15s;position:relative;
}
nav.dock button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.dock button.on{color:var(--purple)}
nav.dock button.on svg{stroke:var(--purple)}
nav.dock button.on:after{content:"";position:absolute;top:-8px;width:22px;height:3px;border-radius:3px;background:var(--purple)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%) translateY(20px);
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:11px 18px;border-radius:12px;
  font-weight:700;font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:rgba(45,212,191,.5)} #toast.ok:before{content:"✓ ";color:var(--teal)}

.empty{text-align:center;color:var(--mute);padding:26px 10px;font-size:13.5px}
.hint{font-size:12px;color:var(--mute);line-height:1.5}
.divider{height:1px;background:var(--line-soft);margin:14px 0}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:rgba(139,92,246,.15);color:#c3aef7;border:1px solid rgba(139,92,246,.3)}
.rowbtn{display:flex;gap:10px;margin-top:12px}
.small{font-size:12px;color:var(--mute)}
.kvs{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px}
.kv{font-size:12px;color:var(--ink-2)} .kv b{color:var(--ink);font-family:var(--disp);font-size:14px}
.histrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line-soft)}
.histrow:first-child{border-top:0}
.histrow .a{font-weight:700;font-size:14px}
.histrow .b{font-size:11.5px;color:var(--mute)}
.histrow .c{text-align:right;font-family:var(--disp);font-weight:700}

/* ---- in-gym power tools ---- */
.lastset{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mute);margin:2px 0 8px}
.lastset b{color:var(--teal);font-weight:700}
.lastset .beat{margin-left:auto;color:var(--purple);font-weight:700;letter-spacing:.03em}
/* Stage 3 — progression targets, decline flag, volume, deload, swap, completion */
.nextset{font-size:11.5px;color:var(--teal);font-weight:600;margin:-4px 0 8px;display:flex;gap:6px;align-items:center}
.declflag{color:var(--warn);font-weight:800;font-size:13px}
.deload{background:linear-gradient(180deg,rgba(245,158,66,.14),rgba(245,158,66,.05));border:1px solid rgba(245,158,66,.45);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.deload .dl-h{font-weight:800;color:var(--warn);font-size:13px;letter-spacing:.02em}
.deload .dl-b{font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.5}
.mg-row{display:flex;align-items:center;gap:10px;padding:5px 0}
.mg-n{width:92px;font-size:12.5px;color:var(--ink);font-weight:600}
.mg-bar{flex:1;height:8px;background:var(--panel-2);border-radius:6px;overflow:hidden}
.mg-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--teal));border-radius:6px}
.mg-v{min-width:56px;text-align:right;font-size:12px;font-weight:700;color:var(--ink-2)}
.swap-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;color:var(--ink);font-size:13.5px}
.swap-opt:active{border-color:var(--purple)}
.swap-opt .nm{flex:1}
.swap-opt .tag{font-size:10px;font-weight:700;color:var(--mute)}
.cs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.cs-tile{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.cs-n{font-family:var(--disp);font-size:24px;font-weight:700;color:var(--teal)}
.cs-l{font-size:11px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.cs-pr{background:linear-gradient(180deg,rgba(139,92,246,.18),rgba(139,92,246,.05));border:1px solid rgba(139,92,246,.5);border-radius:12px;padding:10px 12px;font-weight:700;color:var(--purple);text-align:center;margin-bottom:12px}
.cs-sec{margin-bottom:4px}
.cs-beat{font-size:12.5px;color:var(--ink);padding:4px 0}
.cs-beat .small{color:var(--mute)}

  if(!s.targets || typeof s.targets!=='object') s.targets={cal:TARGETS.cal,protein:TARGETS.protein,carbs:TARGETS.carbs,fat:TARGETS.fat};
  if(!Array.isArray(s.adjustLog)) s.adjustLog=[];

  if(!Array.isArray(s.debriefs)) s.debriefs=[];
  if(!s.settings || typeof s.settings!=='object') s.settings=Object.assign({},DEFAULT_SETTINGS);
  else { for(const k in DEFAULT_SETTINGS){ if(typeof s.settings[k]!=='number') s.settings[k]=DEFAULT_SETTINGS[k]; } }

  if(v<2){ v=2; } // v1 -> v2: adds schemaVersion; fields ensured above; no data touched

let vaultT=null;
function vaultOpen(){ return new Promise((res,rej)=>{ const rq=indexedDB.open(VAULT_DB,2);
  rq.onupgradeneeded=()=>{ const db=rq.result; if(!db.objectStoreNames.contains(VAULT_STORE)) db.createObjectStore(VAULT_STORE); if(!db.objectStoreNames.contains(VAULT_SNAPS)) db.createObjectStore(VAULT_SNAPS); };
  rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
function vaultSave(obj){ return vaultOpen().then(db=>new Promise(res=>{
    const tx=db.transaction([VAULT_STORE,VAULT_SNAPS],"readwrite");
    tx.objectStore(VAULT_STORE).put(obj,VAULT_KEY);
    if(hasData(obj)) tx.objectStore(VAULT_SNAPS).put({date:todayISO(),savedAt:Date.now(),state:obj}, todayISO());
    tx.oncomplete=()=>{ pruneSnaps(); res(); }; tx.onerror=res;
  })).catch(()=>{}); }
function vaultLoad(){ return vaultOpen().then(db=>new Promise(res=>{ const tx=db.transaction(VAULT_STORE,"readonly").objectStore(VAULT_STORE).get(VAULT_KEY); tx.onsuccess=()=>res(tx.result||null); tx.onerror=()=>res(null); })).catch(()=>null); }
function pruneSnaps(){ return vaultOpen().then(db=>new Promise(res=>{
    const st=db.transaction(VAULT_SNAPS,"readwrite").objectStore(VAULT_SNAPS); const kr=st.getAllKeys();
    kr.onsuccess=()=>{ const keys=(kr.result||[]).sort(); const extra=keys.length-SNAP_KEEP; for(let i=0;i<extra;i++) st.delete(keys[i]); res(); }; kr.onerror=res;
  })).catch(()=>{}); }
function snapshotList(){ return vaultOpen().then(db=>new Promise(res=>{
    const st=db.transaction(VAULT_SNAPS,"readonly").objectStore(VAULT_SNAPS); const req=st.getAll();
    req.onsuccess=()=>{ const arr=(req.result||[]).map(r=>({date:r.date,savedAt:r.savedAt,state:r.state,
       counts:{weights:Object.keys(r.state&&r.state.weights||{}).length, workouts:((r.state&&r.state.workouts)||[]).length, checkins:((r.state&&r.state.checkins)||[]).length}}))
       .sort((a,b)=> a.date<b.date?1:-1); res(arr); }; req.onerror=()=>res([]); })).catch(()=>[]); }
function scheduleVault(){ if(!('indexedDB'in window))return; clearTimeout(vaultT); vaultT=setTimeout(()=>vaultSave(S),400); }
function hasData(o){ return !!(o && ((o.weights&&Object.keys(o.weights).length) || (o.checkins&&o.checkins.length) || (o.workouts&&o.workouts.length) || (o.prHistory&&o.prHistory.length))); }
function checksum(str){ let h=0x811c9dc5>>>0; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return ('0000000'+h.toString(16)).slice(-8); }

async function doExport(includePhotos){
  try{
    const payload={ app:"Project Grizzly", type:"grizzly-backup", schemaVersion:SCHEMA_VERSION, exportedAt:new Date().toISOString(),
      counts:{ weigh_ins:Object.keys(S.weights||{}).length, workouts:(S.workouts||[]).length, check_ins:(S.checkins||[]).length, photos:0 },
      data:S, photos:null };
    if(includePhotos && ('indexedDB'in window)){ payload.photos=await idbAll().catch(()=>[]); payload.counts.photos=(payload.photos||[]).length; }
    payload.checksum=checksum(JSON.stringify(payload.data)+"|"+JSON.stringify(payload.photos||[]));
    const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="project-grizzly-backup-"+todayISO()+(includePhotos?"-full":"")+".json";
    document.body.appendChild(a); a.click(); setTimeout(()=>{a.remove(); URL.revokeObjectURL(a.href);},1500);
    S.lastBackup=todayISO(); save();
    toast((includePhotos?"Full backup":"Backup")+" saved — choose “Save to Files”",true);
  }catch(e){ toast("Backup failed — try again"); }
}
/* parse new wrapped backup OR a legacy raw-state export; compute a preview */
function parseBackup(text){
  const obj=JSON.parse(text);
  if(obj && obj.type==="grizzly-backup" && obj.data && typeof obj.data==='object'){
    const data=obj.data, photos=Array.isArray(obj.photos)?obj.photos:null;
    let integrity="none";
    if(obj.checksum) integrity=(checksum(JSON.stringify(data)+"|"+JSON.stringify(photos||[]))===obj.checksum)?"ok":"mismatch";
    return { data, photos, exportedAt:obj.exportedAt||null, schemaVersion:obj.schemaVersion||1, integrity,
      counts:{ weigh_ins:Object.keys(data.weights||{}).length, workouts:(data.workouts||[]).length, check_ins:(data.checkins||[]).length, photos:(photos||[]).length } };
  }
  if(obj && typeof obj==='object' && (obj.weights||obj.workouts||obj.checkins||obj.operator)){
    return { data:obj, photos:null, exportedAt:null, schemaVersion:obj.schemaVersion||1, integrity:"legacy",
      counts:{ weigh_ins:Object.keys(obj.weights||{}).length, workouts:(obj.workouts||[]).length, check_ins:(obj.checkins||[]).length, photos:0 } };
  }
  throw new Error("unrecognized");
}
let pendingRestore=null;
function previewImport(file){ if(!file) return; const rd=new FileReader();
  rd.onload=()=>{ try{ pendingRestore=parseBackup(rd.result); openRestoreSheet(pendingRestore); } catch(e){ toast("That file isn't a Project Grizzly backup"); } };
  rd.onerror=()=>toast("Couldn't read that file");
  rd.readAsText(file); }
async function doRestore(pr){
  if(!pr || !pr.data) return;
  S=migrate(pr.data); save();
  if(pr.photos && pr.photos.length && ('indexedDB'in window)){ try{ for(const p of pr.photos){ if(p&&p.id) await idbPut(p); } photoCache=null; }catch(e){} }
  pendingRestore=null; closeSheet(); toast("Backup restored — welcome back, Operator",true); render();
}
async function restoreSnapshot(date){
  const list=await snapshotList(); const snap=list.find(s=>s.date===date);
  if(!snap){ toast("Snapshot not found"); return; }
  S=migrate(snap.state); save(); closeSheet(); toast("Rolled back to "+fmtDate(date),true); render();
}
function doImport(file){ previewImport(file); } // kept for compatibility

/* ---------- bottom-sheet modal (restore preview, snapshots) ---------- */
function showSheet(html){ const ov=document.getElementById("sheet-overlay"); if(!ov) return; document.getElementById("sheet-body").innerHTML=html; ov.classList.add("show"); }
function closeSheet(){ const ov=document.getElementById("sheet-overlay"); if(ov) ov.classList.remove("show"); }
function openRestoreSheet(pr){
  const int=pr.integrity;
  const intLabel = int==="ok" ? '<span style="color:var(--good)">✓ Integrity verified</span>'
    : int==="mismatch" ? '<span style="color:var(--bad)">⚠ Integrity check FAILED — the file may be corrupt</span>'
    : int==="legacy" ? '<span style="color:var(--mute)">Legacy backup (no checksum)</span>'
    : '<span style="color:var(--mute)">No checksum in file</span>';
  showSheet(`<div class="sheet-h">Restore this backup?</div>
    <p class="hint" style="margin:0 0 10px">This <b>replaces</b> everything currently in the app with the file's contents. Your current data is also snapshotted first.</p>
    <div class="kvs">
      <span class="kv">Exported <b>${pr.exportedAt?fmtDate(pr.exportedAt.slice(0,10)):'unknown'}</b></span>
      <span class="kv">Weigh-ins <b class="tnum">${pr.counts.weigh_ins}</b></span>
      <span class="kv">Workouts <b class="tnum">${pr.counts.workouts}</b></span>
      <span class="kv">Check-ins <b class="tnum">${pr.counts.check_ins}</b></span>
      <span class="kv">Photos <b class="tnum">${pr.counts.photos}</b></span>
    </div>
    <div class="small" style="margin:10px 0 14px">${intLabel}${pr.schemaVersion?(' · schema v'+pr.schemaVersion):''}</div>
    <div class="rowbtn">
      <button class="btn primary" id="confirmRestore">Restore &amp; replace</button>
      <button class="btn ghost" id="cancelRestore">Cancel</button>
    </div>`);
  document.getElementById("confirmRestore").onclick=()=>doRestore(pendingRestore);
  document.getElementById("cancelRestore").onclick=()=>{ pendingRestore=null; closeSheet(); };

async function openSnapshotSheet(){
  const list=await snapshotList();
  const rows = list.length ? list.map(s=>`<div class="histrow"><div><div class="a">${fmtDate(s.date)}</div>
      <div class="b tnum">${s.counts.weights} weigh-ins · ${s.counts.workouts} workouts · ${s.counts.checkins} check-ins</div></div>
      <button class="btn sm" data-snap="${s.date}">Roll back</button></div>`).join("")
    : '<div class="empty">No on-device snapshots yet — they build up automatically as you log each day.</div>';
  showSheet(`<div class="sheet-h">Earlier on-device snapshots</div>
    <p class="hint" style="margin:0 0 6px">Automatic daily copies kept on this device (last ${SNAP_KEEP} days). Roll back if something looks off.</p>
    <div style="margin-top:6px">${rows}</div>
    <div class="rowbtn" style="margin-top:12px"><button class="btn ghost" id="snapClose">Close</button></div>`);
  document.querySelectorAll("[data-snap]").forEach(b=>b.onclick=()=>restoreSnapshot(b.dataset.snap));
  document.getElementById("snapClose").onclick=closeSheet;
}

/* ---------- dynamic targets + coaching engine ---------- */
function T(){ const t=S.targets||{}; return {
  cal:t.cal||TARGETS.cal, protein:t.protein||TARGETS.protein, carbs:t.carbs||TARGETS.carbs, fat:t.fat||TARGETS.fat,
  water:TARGETS.waterGal, steps:TARGETS.steps }; }
const TARGET_RATE=-0.75; // lb/week goal in Phase 1 (lose fat, hold strength)
function weeklyRate(){ const a=sevenDayAvg(), p=prevAvg(); return (a!=null&&p!=null)? round1(a-p):null; }
function daysLogged(){ return sortedWeightDates().length; }
function daysSinceAdjust(){
  const last=(S.adjustLog&&S.adjustLog.length)? S.adjustLog[S.adjustLog.length-1].date : S.startDate;
  if(!last) return 999;
  return Math.round((new Date(todayISO())-new Date(last))/86400000);
}
function calcMacros(cal){ const protein=T().protein, fat=T().fat;
  return {cal, protein, fat, carbs:Math.max(0,Math.round((cal-protein*4-fat*9)/4))}; }
function coachCalorie(){
  const rate=weeklyRate(), n=daysLogged(), cal=T().cal;
  if(n<10 || rate==null) return {status:'need-data', msg:`Log ${Math.max(1,14-n)} more morning weigh-ins to unlock calorie coaching.`, cal, rate};
  let status='hold', newCal=cal;
  if(rate > -0.35){ status='cut'; newCal=cal-150; }        // stalling or gaining
  else if(rate < -1.25){ status='add'; newCal=cal+150; }   // too fast — protect muscle
  const ready = S.adjustLog.length ? daysSinceAdjust()>=14 : daysLogged()>=14;
  return {status, ready, rate, cal, newCal, macros:calcMacros(newCal)};
}
function applyCalorie(cal){
  const m=calcMacros(cal); S.targets={cal:m.cal,protein:m.protein,carbs:m.carbs,fat:m.fat};
  S.adjustLog.push({date:todayISO(),cal:m.cal}); save();
}
function bpStatus(sys,dia){
  sys=parseFloat(sys); dia=parseFloat(dia); if(!sys||!dia) return null;
  if(sys>=140||dia>=90) return {label:'Stage 2 — check with your doctor',dot:'r',ok:false};
  if(sys>=130||dia>=80) return {label:'Stage 1 — watch it',dot:'y',ok:false};
  if(sys>=120)          return {label:'Elevated',dot:'y',ok:false};
  return {label:'Normal',dot:'g',ok:true};
}
function measDelta(key){
  const cs=S.checkins.filter(c=>c.measurements&&c.measurements[key]);
  if(cs.length<2) return null;
  const a=parseFloat(cs[cs.length-1].measurements[key]), b=parseFloat(cs[cs.length-2].measurements[key]);
  return (isNaN(a)||isNaN(b))?null:round1(a-b);
}
function sundaySummary(){
  const c=latestCheckin();
  const op=String(c?c.operation:operationNo()).padStart(3,'0');
  const w=latestWeight(), avg=sevenDayAvg(), rate=weeklyRate(), bf=navyBF(), lm=leanMass();
  const dW=measDelta('waistNavel');
  const prWk=(S.prHistory||[]).filter(p=>(new Date(todayISO())-new Date(p.date))/86400000<=7);
  const L=[`PROJECT GRIZZLY — Operation ${op}`, `${fmtDate(todayISO())} · Operator David Devitt`, ''];
  L.push(`Weight: ${w??'—'} lb (7-day avg ${avg??'—'}${rate!=null?`, ${rate>0?'+':''}${rate}/wk`:''})`);
  if(c?.measurements?.waistNavel) L.push(`Waist: ${c.measurements.waistNavel}"${dW!=null?` (${dW>0?'+':''}${dW}")`:''}`);
  if(bf!=null) L.push(`Body fat: ${bf}% · Lean mass: ${lm} lb`);
  if(c&&c.bpSys&&c.bpDia){ const s=bpStatus(c.bpSys,c.bpDia); L.push(`BP: ${c.bpSys}/${c.bpDia}${s?` (${s.label})`:''}${c.rhr?` · RHR ${c.rhr}`:''}`); }
  if(c&&c.back!=null&&c.back!=='') L.push(`Back: ${c.back}/10 · Sleep ${c.sleep||'—'}h · Energy ${c.energy||'—'}/10`);
  L.push(`Compliance: ${compliance()}%`);
  if(prWk.length) L.push(`PRs this week: ${prWk.map(p=>`${p.name} ${p.w}×${p.r}`).join(', ')}`);
  if(c?.wins) L.push(`Wins: ${c.wins}`);
  if(c?.focus) L.push(`Next week: ${c.focus}`);
  const cc=coachCalorie();
  if(cc.status==='cut') L.push(`Coach: loss stalling — consider ${cc.newCal} kcal.`);
  else if(cc.status==='add') L.push(`Coach: dropping fast — consider ${cc.newCal} kcal to hold muscle.`);
  else if(cc.status==='hold') L.push(`Coach: on track — hold ${cc.cal} kcal.`);
  return L.join('\n');
}

/* ---------- math helpers ---------- */
const round1 = n => Math.round(n*10)/10;
function sortedWeightDates(){ return Object.keys(S.weights).sort(); }
function latestWeight(){ const d=sortedWeightDates(); return d.length? S.weights[d[d.length-1]] : null; }
function sevenDayAvg(){
  const d=sortedWeightDates(); if(!d.length) return null;
  const last7=d.slice(-7).map(k=>S.weights[k]);
  return round1(last7.reduce((a,b)=>a+b,0)/last7.length);
}
function prevAvg(){
  const d=sortedWeightDates(); if(d.length<8) return null;
  const win=d.slice(-14,-7).map(k=>S.weights[k]); if(!win.length) return null;
  return round1(win.reduce((a,b)=>a+b,0)/win.length);
}
function e1rm(w,r){ return r>0 && w>0 ? Math.round(w*(1+r/30)) : 0; } // Epley
function latestCheckin(){ return S.checkins.length? S.checkins[S.checkins.length-1] : null; }
function navyBF(){
  const c=latestCheckin(); if(!c) return null;
  const waist=parseFloat(c.measurements?.waistNavel), neck=parseFloat(c.measurements?.neck);
  if(!waist||!neck||waist<=neck) return null;
  const h=PROFILE.heightIn;
  const bf = 86.010*Math.log10(waist-neck) - 70.041*Math.log10(h) + 36.76;
  return round1(Math.max(4,Math.min(50,bf)));
}
function leanMass(){
  const w=latestWeight(), bf=navyBF();
  if(w==null||bf==null) return null;
  return round1(w*(1-bf/100));
}
function operationNo(){ return S.checkins.length + 1; } // current operation = next check-in

// weekly compliance (last 7 days): workouts hit vs planned, nutrition meals, steps, water
function compliance(){
  const days=[]; const now=new Date();
  for(let i=6;i>=0;i--){ const dt=new Date(now); dt.setDate(dt.getDate()-i); days.push(dt.toISOString().slice(0,10)); }
  let pts=0, max=0;
  days.forEach(iso=>{
    const dow=DOW[new Date(iso+"T00:00").getDay()];
    const planned = !(dow==="sun"); // 6 training days
    if(planned){ max+=1; if(S.workouts.some(w=>w.date===iso && w.exercises.some(e=>e.sets.some(s=>s.w||s.r)))) pts+=1; }
    const n=S.nutrition[iso];
    max+=1; if(n){ const done=Object.values(n.meals||{}).filter(Boolean).length; pts += Math.min(1, done/6); }
    max+=0.5; if(n && n.steps>=TARGETS.steps) pts+=0.5;
    max+=0.5; if(n && n.water>=TARGETS.waterGal) pts+=0.5;
  });
  return max? Math.round(pts/max*100) : 0;
}

/* ---------- power-tool helpers ---------- */
function setScore(s){ const w=parseFloat(s.w), r=parseInt(s.r); return (w>0&&r>0)? e1rm(w,r):0; }
function bestSet(sets){ let best=null,bs=-1; (sets||[]).forEach(s=>{ const sc=setScore(s); if(sc>bs){bs=sc;best=s;} }); return best; }
// most recent PRIOR session containing this exercise with logged sets
function lastSession(exName){
  const today=todayISO();
  const cands=S.workouts
    .filter(w=>w.date!==today || false) // exclude today's own record; still allow older same-day? keep simple: exclude today
    .filter(w=>w.exercises && w.exercises.some(e=>e.name===exName && e.sets.some(s=>parseFloat(s.w)>0)))
    .sort((a,b)=>a.date<b.date?1:-1);
  if(!cands.length) return null;
  const w=cands[0]; const ex=w.exercises.find(e=>e.name===exName);
  return { date:w.date, sets:ex.sets.filter(s=>parseFloat(s.w)>0), best:bestSet(ex.sets) };
}
const PLATES=[45,35,25,10,5,2.5];
function platesPerSide(target,bar){
  let per=(target-bar)/2; if(per<0) return {err:"Below bar weight"};
  const out=[]; PLATES.forEach(p=>{ while(per>=p-1e-9){ out.push(p); per=Math.round((per-p)*100)/100; } });
  if(per>0.01) return {plates:out, rem:per};
  return {plates:out};
}
// time series
function weightSeries(){ return sortedWeightDates().map(d=>({t:d,v:S.weights[d]})); }
function checkinSeries(sel){
  return S.checkins.map(c=>{
    let v=null;
    if(sel==="waist") v=parseFloat(c.measurements?.waistNavel);
    else if(sel==="chest") v=parseFloat(c.measurements?.chest);
    else if(sel==="armRF") v=parseFloat(c.measurements?.armRF);
    else if(sel==="bpSys") v=parseFloat(c.bpSys);
    else if(sel==="rhr") v=parseFloat(c.rhr);
    else if(sel==="back"){ if(c.back!=null && c.back!=='') v=Number(c.back); }
    else if(sel==="bf"){ const wa=parseFloat(c.measurements?.waistNavel),nk=parseFloat(c.measurements?.neck);
      if(wa&&nk&&wa>nk) v=round1(Math.max(4,Math.min(50,86.010*Math.log10(wa-nk)-70.041*Math.log10(PROFILE.heightIn)+36.76))); }
    return (v!=null && !isNaN(v))?{t:c.date,v}:null;
  }).filter(Boolean);
}
function strengthSeries(exName){
  return S.workouts
    .filter(w=>w.exercises && w.exercises.some(e=>e.name===exName))
    .map(w=>{ const ex=w.exercises.find(e=>e.name===exName); const b=bestSet(ex.sets); return b&&setScore(b)?{t:w.date,v:setScore(b)}:null; })
    .filter(Boolean).sort((a,b)=>a.t<b.t?-1:1);
}

/* ============================================================
   GRIZZLY INTELLIGENCE ENGINE
   Pure analytics. Rules: never invent data; mark estimates as "est.";
   attach a confidence to every insight; recommend — never auto-apply.
   ============================================================ */
const DAYMS=86400000;
function dnum(iso){ return Math.round(new Date(iso+"T00:00").getTime()/DAYMS); }
function linReg(pts){ const n=pts.length; if(n<2) return null;
  let sx=0,sy=0,sxx=0,sxy=0; for(const p of pts){ sx+=p.x; sy+=p.y; sxx+=p.x*p.x; sxy+=p.x*p.y; }
  const d=n*sxx-sx*sx; return d? (n*sxy-sx*sy)/d : null; }
function conf(have, medAt, highAt){
  if(have < Math.ceil(medAt/2)) return {label:"Insufficient data", k:0};
  if(have < medAt) return {label:"Low confidence", k:1};
  if(have < highAt) return {label:"Medium confidence", k:2};
  return {label:"High confidence", k:3};
}
function rollingAvg(n){ const d=sortedWeightDates(); if(!d.length) return null; const v=d.slice(-n).map(k=>S.weights[k]); return round1(v.reduce((a,b)=>a+b,0)/v.length); }
function weightRatePerWeek(days){
  const d=sortedWeightDates(); if(d.length<3) return null;
  const cutoff=dnum(todayISO())-days;
  const pts=d.filter(k=>dnum(k)>=cutoff).map(k=>({x:dnum(k),y:S.weights[k]}));
  if(pts.length<3) return null; const slope=linReg(pts); return slope==null?null:round1(slope*7);
}
function bodyCompEstimate(){ const w=latestWeight(), bf=navyBF(); if(w==null||bf==null) return null;
  return {weight:w, bf, lean:round1(w*(1-bf/100)), fat:round1(w*bf/100)}; }

function bodyIntel(){
  const n=sortedWeightDates().length, c=conf(n,14,28);
  if(c.k===0) return {domain:"Body",confidence:c,insufficient:true,tone:"neutral",
    text:`Log ${Math.max(1,7-n)} more morning weigh-ins to unlock weight-trend analysis.`,
    detail:"Weigh in each morning under the same conditions — the averages do the rest."};
  const a7=rollingAvg(7), a28=rollingAvg(28), rate=weightRatePerWeek(28) ?? weeklyRate();
  let tone="good", text;
  if(rate==null){ tone="neutral"; text=`7-day average ${a7} lb — a few more days sets the trend.`; }
  else if(rate> -0.35){ tone="warn"; text=`Fat loss has stalled (${rate>0?'+':''}${rate} lb/wk over ~4 weeks).`; }
  else if(rate< -1.25){ tone="warn"; text=`Dropping fast — ${Math.abs(rate)} lb/wk. Protect muscle; a small calorie bump may help.`; }
  else { tone="good"; text=`On track — down ${Math.abs(rate)} lb/wk toward your ${Math.abs(TARGET_RATE)} lb/wk goal.`; }
  const cmp = (a7!=null&&a28!=null) ? (a7<a28?" Short-term is below the month — momentum is good." : a7>a28?" Short-term is above the month — watch the last week." : " Holding steady.") : "";
  return {domain:"Body",confidence:c,tone,text,rate,a7,a28,
    detail:`7-day avg ${a7??'—'} lb${a28!=null?` · 28-day avg ${a28} lb`:''}.${cmp} Daily swings are normal.`};

function trackedSessions(){ return S.workouts.filter(w=>w.exercises&&w.exercises.some(e=>e.sets&&e.sets.some(s=>parseFloat(s.w)>0))).length; }
function strengthIntel(){
  const lifts=[]; const seen=new Set();
  BENCHMARKS.forEach(nm=>{ const s=strengthSeries(nm); if(s.length>=2){ lifts.push({name:nm,s}); seen.add(nm); } });
  const names=new Set(); S.workouts.forEach(w=>w.exercises&&w.exercises.forEach(e=>names.add(e.name)));
  names.forEach(nm=>{ if(!seen.has(nm)){ const s=strengthSeries(nm); if(s.length>=3) lifts.push({name:nm,s}); } });
  const sessions=trackedSessions(), c=conf(sessions,6,12);
  if(!lifts.length || c.k===0) return {domain:"Strength",confidence:c,insufficient:true,tone:"neutral",
    text:`Log a few more tracked sessions to unlock strength trends.`,detail:"Each lift needs ≥2 sessions to estimate a trend (Epley e1RM)."};
  const trends=lifts.map(({name,s})=>{ const slope=linReg(s.map(p=>({x:dnum(p.t),y:p.v})))||0;
    const first=s[0].v,last=s[s.length-1].v, pct=first?round1((last-first)/first*100):0;
    const pr=S.prs[name]; const daysSincePR=pr?(dnum(todayISO())-dnum(pr.date)):null;
    return {name,slope,pct,first,last,n:s.length,daysSincePR}; });
  trends.sort((a,b)=>b.pct-a.pct);
  const best=trends[0];
  const plateau=trends.find(t=>t.n>=4 && Math.abs(t.slope)<0.3 && (t.daysSincePR==null||t.daysSincePR>=21));
  const rate=weightRatePerWeek(28)??weeklyRate();
  let tone,text,detail;
  if(plateau){ tone="warn"; text=`${plateau.name} has plateaued (flat e1RM${plateau.daysSincePR!=null?`, no PR in ${plateau.daysSincePR}d`:''}).`;
    detail=`Add a rep in range or a small load bump — deload if it persists. Best mover: ${best.name} ${best.pct>0?'+':''}${best.pct}%.`; }
  else { tone="good"; text=`${best.name} up ${best.pct>0?'+':''}${best.pct}% (est. e1RM ${best.first}→${best.last}).`;
    detail=`${lifts.length} tracked lift(s) over ${sessions} sessions.${(rate!=null&&rate<-0.2&&best.pct>=0)?" Strength holding while weight drops — recomp is working.":""}`; }
  return {domain:"Strength",confidence:c,tone,text,detail,best,plateau};
}
function nutritionWindow(days){ const out=[]; const now=new Date();
  for(let i=0;i<days;i++){ const dt=new Date(now); dt.setDate(dt.getDate()-i); const iso=dt.toISOString().slice(0,10);
    const nn=S.nutrition[iso]; if(nn && (nn.protein||nn.carbs||nn.fat)) out.push({iso,cal:Math.round((nn.protein||0)*4+(nn.carbs||0)*4+(nn.fat||0)*9),p:nn.protein||0}); }
  return out; }
function nutritionIntel(){
  const w=nutritionWindow(14), c=conf(w.length,5,10);
  if(c.k===0) return {domain:"Nutrition",confidence:c,insufficient:true,tone:"neutral",
    text:`Log your macros on a few more days to unlock nutrition analysis.`,detail:"Enter protein / carbs / fat on the Fuel tab."};
  const t=T(), avgCal=Math.round(w.reduce((a,b)=>a+b.cal,0)/w.length), avgP=Math.round(w.reduce((a,b)=>a+b.p,0)/w.length);
  const adherence=Math.round(w.filter(d=>d.p>=t.protein*0.9).length/w.length*100);
  const rate=weightRatePerWeek(28)??weeklyRate();
  let tone="good", text;
  if(avgP < t.protein*0.85){ tone="warn"; text=`Protein is running low — avg ${avgP} g vs ${t.protein} g target.`; }
  else if(rate!=null && rate>-0.2 && avgCal>=t.cal-50){ tone="warn"; text=`Intake (~${avgCal} kcal avg) looks high for a stalled scale — a 150 kcal trim may restart loss.`; }
  else { tone="good"; text=`Nutrition on point — ~${avgCal} kcal avg, protein ${avgP} g (${adherence}% of days on target).`; }
  return {domain:"Nutrition",confidence:c,tone,text,avgCal,avgP,adherence,
    detail:`${w.length} day(s) logged in the last 14. Planned-vs-actual tracking arrives in a later stage.`};
}
function recoveryIntel(){
  const cs=S.checkins.filter(c=>(c.back!=null&&c.back!=='')||c.sleep||c.energy), c=conf(cs.length,2,4);
  if(c.k===0) return {domain:"Recovery",confidence:c,insufficient:true,tone:"neutral",
    text:`Complete a couple of Sunday check-ins to unlock recovery trends.`,detail:"Sleep, energy, stress and back pain are tracked each week."};
  const last=S.checkins[S.checkins.length-1], prev=S.checkins[S.checkins.length-2];
  const backNow=last&&last.back!=null&&last.back!==''?Number(last.back):null;
  const backPrev=prev&&prev.back!=null&&prev.back!==''?Number(prev.back):null;
  const sleep=last&&last.sleep?parseFloat(last.sleep):null;

  else { tone="good"; text=`Recovery looks solid${backNow!=null?` — back ${backNow}/10`:''}${sleep!=null?`, sleep ${sleep} h`:''}.`; }
  return {domain:"Recovery",confidence:c,tone,text,detail:`From ${cs.length} check-in(s).`};
}

/* ---------- generic line chart ---------- */
function drawLineChart(cv, pts, opts){
  opts=opts||{}; const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth||300, h=cv.clientHeight||180;
  cv.width=w*dpr; cv.height=h*dpr; const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  if(!pts||pts.length<2){
    ctx.fillStyle="#6E7783"; ctx.font="12px -apple-system,sans-serif"; ctx.textAlign="center";
    ctx.fillText(pts&&pts.length===1?"One point — log more to draw the trend":"Not enough data yet", w/2, h/2); return;
  }
  const vals=pts.map(p=>p.v); let min=Math.min(...vals), max=Math.max(...vals);
  if(min===max){ min-=1; max+=1; } const pad=(max-min)*0.15; min-=pad; max+=pad;
  const L=34, Rp=8, T=10, B=20;
  const X=i=>L+i*(w-L-Rp)/(pts.length-1);
  const Y=v=>T+(1-(v-min)/(max-min))*(h-T-B);
  const col=opts.color||"#8B5CF6";
  // gridlines + y labels
  ctx.strokeStyle="#22262d"; ctx.fillStyle="#6E7783"; ctx.font="10px -apple-system,sans-serif"; ctx.textAlign="right"; ctx.lineWidth=1;
  for(let g=0; g<=3; g++){ const val=min+(max-min)*g/3, y=Y(val);
    ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(w-Rp,y); ctx.stroke();
    ctx.fillText(opts.fmt?opts.fmt(val):Math.round(val), L-5, y+3); }
  // area
  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,opts.fill||"rgba(139,92,246,.28)"); grad.addColorStop(1,"rgba(139,92,246,0)");
  ctx.beginPath(); ctx.moveTo(X(0),Y(vals[0])); pts.forEach((p,i)=>ctx.lineTo(X(i),Y(p.v)));
  ctx.lineTo(X(pts.length-1),h-B); ctx.lineTo(X(0),h-B); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
  // line
  ctx.beginPath(); ctx.moveTo(X(0),Y(vals[0])); pts.forEach((p,i)=>ctx.lineTo(X(i),Y(p.v)));
  ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.lineJoin="round"; ctx.stroke();
  // endpoint
  const lx=X(pts.length-1), ly=Y(vals[vals.length-1]);
  ctx.beginPath(); ctx.arc(lx,ly,4,0,7); ctx.fillStyle="#2DD4BF"; ctx.fill();
  ctx.beginPath(); ctx.arc(lx,ly,7,0,7); ctx.strokeStyle="rgba(45,212,191,.4)"; ctx.lineWidth=2; ctx.stroke();
}

function compressImage(file, maxPx, quality){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>{ const img=new Image();
      img.onload=()=>{ let{width:iw,height:ih}=img; const sc=Math.min(1,maxPx/Math.max(iw,ih));
        const cw=Math.round(iw*sc),ch=Math.round(ih*sc);
        const c=document.createElement("canvas"); c.width=cw; c.height=ch;
        c.getContext("2d").drawImage(img,0,0,cw,ch);
        res(c.toDataURL("image/jpeg",quality||0.8)); };
      img.onerror=rej; img.src=rd.result; };
    rd.onerror=rej; rd.readAsDataURL(file);
  });
}

const REST={end:0,dur:0,int:null};
function ensureRestBar(){
  let el=document.getElementById("restbar");
  if(!el){ el=document.createElement("div"); el.id="restbar";
    el.innerHTML=`<div><div class="rlbl">Rest</div><div class="rt" id="rt">0:00</div></div>

      <button data-rstop aria-label="stop">✕</button>`;

    el.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return;
      if(b.hasAttribute("data-rstop")) stopRest();

  }

}
function startRest(sec){

  REST.dur=sec; REST.end=Date.now()+sec*1000;

function tickRest(){
  const el=document.getElementById("restbar"); if(!el) return;
  const left=Math.max(0,REST.end-Date.now()); const s=Math.ceil(left/1000);
  const rt=document.getElementById("rt");
  rt.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  if(left<=0){ rt.classList.add("done"); rt.textContent="DONE"; clearInterval(REST.int);
    if(navigator.vibrate) navigator.vibrate([120,60,120]); setTimeout(stopRest,2500); }
  else rt.classList.remove("done");
}

 "DB Calf Raise":["Calves"],

 "DB Farmer Carry":["Conditioning"],"Sled Push":["Conditioning"],"Treadmill Incline Intervals":["Conditioning"],"Treadmill Incline Push":["Conditioning"],"Sandbag Carry":["Conditioning"]
};
function muscleOf(name){ if(MUSCLE[name]) return MUSCLE[name];
  const n=(name||"").toLowerCase();
  if(/leg ext/.test(n)) return ["Quads"];
  if(/leg curl|hamstring|rdl|romanian|nordic|glute-?ham/.test(n)) return ["Hamstrings"];
  if(/squat|lunge|leg press|step-?up|hack|belt squat/.test(n)) return ["Quads"];
  if(/calf|calves/.test(n)) return ["Calves"];
  if(/pulldown|\brow\b|pull-?up|chin|pullover|shrug/.test(n)) return ["Back"];
  if(/curl/.test(n)) return ["Biceps"];
  if(/lateral|rear delt|shoulder press|\bohp\b|arnold|overhead press|\braise\b/.test(n)) return ["Shoulders"];
  if(/triceps|pushdown|skull|kickback|\bdip/.test(n)) return ["Triceps"];

  return ["Other"];
}
const ALT={

 Biceps:[["Preacher Curl","g"],["Incline DB Curl","g"],["DB Hammer Curl","y"],["EZ Bar Curl","y"],["Concentration Curl","g"]],
 Quads:[["Goblet Squat","y"],["DB Bulgarian Split Squat","y"],["DB Reverse Lunge","y"],["Leg Extension","g"],["DB Step-Up","y"],["Belt Squat","g"]],
 Hamstrings:[["Lying Leg Curl","g"],["Seated Leg Curl","g"],["DB Romanian Deadlift","y"],["Glute-Ham Raise","y"]],

function subsFor(name){ const g=muscleOf(name)[0]; return (ALT[g]||[]).filter(a=>a[0]!==name).slice(0,6); }
function parseScheme(scheme){ if(!scheme) return null;
  const m=String(scheme).match(/(\d+)\s*[×x]\s*(\d+)(?:\s*[–-]\s*(\d+))?/);
  if(!m) return null; const sets=+m[1], low=+m[2], high=m[3]?+m[3]:+m[2]; return {sets,low,high}; }
function progInc(name){ const s=S.settings||DEFAULT_SETTINGS;
  return /squat|lunge|leg press|deadlift|hack|belt|hip thrust|rdl|romanian/i.test(name) ? (s.lowerInc||10) : (s.upperInc||5); }
function computeNext(name, scheme, rawSets){
  const sch=parseScheme(scheme); if(!sch) return null;
  const sets=(rawSets||[]).map(s=>({w:parseFloat(s.w),r:parseInt(s.r),rpe:parseFloat(s.rpe)})).filter(s=>s.w>0&&s.r>0);
  if(!sets.length) return null;
  const topW=Math.max(...sets.map(s=>s.w)), working=sets.filter(s=>s.w>=topW-0.01);
  const rpeCap=(S.settings&&S.settings.rpeCap)||9, rpeOk=working.every(s=>isNaN(s.rpe)||s.rpe<=rpeCap), inc=progInc(name);
  if(sch.high>sch.low){
    if(working.length>=sch.sets && working.every(s=>s.r>=sch.high) && rpeOk)
      return {type:"load", w:round1(topW+inc), r:sch.low, msg:`+${inc} lb → ${round1(topW+inc)}×${sch.low} (you hit the top of the range)`};
    const bestR=Math.max(...working.map(s=>s.r)), tr=Math.min(sch.high,(bestR||sch.low)+1);
    return {type:"rep", w:topW, r:tr, msg:`${topW}×${tr} — one more rep toward ${sch.high}`};
  }
  if(working.length>=sch.sets && working.every(s=>s.r>=sch.low) && rpeOk)
    return {type:"load", w:round1(topW+inc), r:sch.low, msg:`+${inc} lb → ${round1(topW+inc)}×${sch.low} (all sets hit)`};
  return {type:"hold", w:topW, r:sch.low, msg:`Repeat ${topW}×${sch.low} — nail all ${sch.sets} sets`};
}
function nextTarget(name, scheme){ const last=lastSession(name); return last? computeNext(name,scheme,last.sets):null; }
function declineFlag(name){ const s=strengthSeries(name); if(s.length<3) return false;
  const slope=linReg(s.slice(-4).map(p=>({x:dnum(p.t),y:p.v}))); return slope!=null && slope< -0.4; }
function weekVolume(){
  const since=dnum(todayISO())-6, vol={}, days={};
  S.workouts.filter(w=>dnum(w.date)>=since).forEach(w=>{
    const touched=new Set();
    (w.exercises||[]).forEach(e=>{ const n=(e.sets||[]).filter(s=>parseFloat(s.w)>0||parseInt(s.r)>0).length;
      if(!n) return; muscleOf(e.name).forEach(g=>{ vol[g]=(vol[g]||0)+n; touched.add(g); }); });
    touched.forEach(g=>{ (days[g]=days[g]||new Set()).add(w.date); });
  });
  return Object.keys(vol).map(g=>({group:g,sets:vol[g],days:days[g]?days[g].size:0})).sort((a,b)=>b.sets-a.sets);
}
function deloadSuggest(){
  const reasons=[]; const rec=recoveryIntel(), str=strengthIntel();
  if(rec.tone==="warn") reasons.push("recovery is flagged");
  if(str.plateau) reasons.push(`${str.plateau.name} has plateaued`);
  const declining=BENCHMARKS.find(declineFlag); if(declining) reasons.push(`${declining} is trending down`);
  const total=weekVolume().reduce((a,b)=>a+b.sets,0); if(total>=90) reasons.push("weekly set volume is high");
  return {suggest:reasons.length>=2, reasons};
}

let progMetric="weight", progPose="Front", progA=null, progB=null, photoCache=null;
function progMetrics(){
  const base=[["weight","Weight"],["waist","Waist"],["bf","Body Fat"]];
  const health=[["bpSys","Blood Pressure"],["rhr","Resting HR"],["back","Back Pain"]]
    .filter(m=>checkinSeries(m[0]).length>0);
  const lifts=BENCHMARKS.filter(n=>strengthSeries(n).length>0)
    .map(n=>["lift:"+n, n.replace("Barbell ","BB ").replace("DB ","")]);
  return base.concat(health,lifts);
}
function metricSeries(key){
  if(key==="weight") return {pts:weightSeries(),unit:" lb",color:"#8B5CF6",up:false,fmt:v=>Math.round(v)};
  if(key==="waist")  return {pts:checkinSeries("waist"),unit:'"',color:"#2DD4BF",up:false,fmt:v=>v.toFixed(1)};
  if(key==="bf")     return {pts:checkinSeries("bf"),unit:"%",color:"#E3A008",up:false,fmt:v=>v.toFixed(1)};
  if(key==="bpSys")  return {pts:checkinSeries("bpSys"),unit:" sys",color:"#F0553B",up:false,fmt:v=>Math.round(v)};
  if(key==="rhr")    return {pts:checkinSeries("rhr"),unit:" bpm",color:"#2DD4BF",up:false,fmt:v=>Math.round(v)};
  if(key==="back")   return {pts:checkinSeries("back"),unit:"/10",color:"#8B5CF6",up:false,fmt:v=>Math.round(v)};
  if(key.startsWith("lift:")) return {pts:strengthSeries(key.slice(5)),unit:" e1RM",color:"#8B5CF6",up:true,fmt:v=>Math.round(v)};
  return {pts:[],unit:"",color:"#8B5CF6",up:true,fmt:v=>v};
}
function VIEW_progress(){
  const metrics=progMetrics();
  if(!metrics.some(m=>m[0]===progMetric)) progMetric="weight";
  const chips=metrics.map(m=>`<button class="chip ${m[0]===progMetric?'on':''}" data-metric="${m[0]}">${m[1]}</button>`).join("");
  return `
  <div class="section-h"><h2>Progress</h2><span class="badge" style="background:rgba(45,212,191,.12);color:#8be7db;border-color:rgba(45,212,191,.3)">You can see it</span><div class="rule"></div></div>

  <div class="section-h" style="margin-top:6px"><h2 style="font-size:14px">Trends</h2><div class="rule"></div></div>
  <div class="card">
    <div class="chip-row">${chips}</div>
    <div class="chart-wrap"><canvas class="chart" id="trendChart"></canvas></div>
    <div class="chart-meta" id="chartMeta"></div>
  </div>

  <div class="section-h"><h2 style="font-size:14px">Progress Photos</h2><div class="rule"></div></div>
  <div class="card">
    <div class="photo-row">
      <div class="field" style="flex:1;min-width:130px"><span class="label">Pose</span>
        <select id="photoPose">${PHOTO_LIST.map(p=>`<option ${p===progPose?'selected':''}>${p}</option>`).join("")}</select></div>
      <button class="btn primary" id="addPhotoBtn" style="width:auto">＋ Add photo</button>
      <input type="file" id="photoFile" accept="image/*" style="display:none"/>
    </div>
    <p class="hint" style="margin:10px 0 0">Stored privately on this device. Same lighting, distance and pose each week for a clean comparison.</p>
    <div class="pose-grid" id="poseGrid"><div class="pcell empty-p">Loading…</div></div>
  </div>

  <div class="section-h"><h2 style="font-size:14px">Compare · Before / After</h2><div class="rule"></div></div>
  <div class="card" id="compareCard">
    <div class="field"><span class="label">Pose</span>
      <select id="cmpPose">${PHOTO_LIST.map(p=>`<option ${p===progPose?'selected':''}>${p}</option>`).join("")}</select></div>
    <div id="compareArea" style="margin-top:12px"><div class="empty">Add two photos of the same pose to compare.</div></div>
  </div>
  `;
}
function drawProgress(){
  const cv=document.getElementById("trendChart"); if(!cv) return;
  const m=metricSeries(progMetric);
  drawLineChart(cv, m.pts, {color:m.color, fmt:m.fmt});
  const meta=document.getElementById("chartMeta"); if(!meta) return;
  const pts=m.pts;
  if(pts.length>=1){ const first=pts[0].v, last=pts[pts.length-1].v, dv=round1(last-first);
    const improved = m.up ? dv>0 : dv<0;
    const col = dv===0?"var(--ink)":(improved?"var(--teal)":"var(--warn)");
    meta.innerHTML=`<span class="cm">Latest <b class="tnum">${m.fmt(last)}${m.unit}</b></span>
      <span class="cm">Change <b class="tnum" style="color:${col}">${dv>0?'+':''}${dv}${m.unit}</b></span>
      <span class="cm">Points <b class="tnum">${pts.length}</b></span>`;
  } else meta.innerHTML=`<span class="cm">No data yet — log to build this trend.</span>`;
}
function bindProgress(){
  document.querySelectorAll("[data-metric]").forEach(b=>b.onclick=()=>{ progMetric=b.dataset.metric; render(); });
  const pose=document.getElementById("photoPose");
  if(pose) pose.onchange=()=>{ progPose=pose.value; const cp=document.getElementById("cmpPose"); if(cp) cp.value=progPose; progA=progB=null; renderCompareArea(); };
  const cmp=document.getElementById("cmpPose");
  if(cmp) cmp.onchange=()=>{ progPose=cmp.value; progA=progB=null; renderCompareArea(); };
  const addBtn=document.getElementById("addPhotoBtn"), file=document.getElementById("photoFile");
  if(addBtn&&file){ addBtn.onclick=()=>file.click();
    file.onchange=async()=>{ const f=file.files[0]; if(!f) return;
      try{ const data=await compressImage(f,1280,0.82);
        const rec={id:"p"+Date.now(), pose:document.getElementById("photoPose").value, date:todayISO(), data};
        await idbPut(rec); if(!photoCache) photoCache=[]; photoCache.push(rec);
        toast("Photo saved",true); renderPoseGrid(); renderCompareArea();
      }catch(err){ toast("Couldn't save that photo"); }
      file.value=""; };
  }
  if(photoCache){ renderPoseGrid(); renderCompareArea(); }
  else idbAll().then(list=>{ photoCache=list||[]; renderPoseGrid(); renderCompareArea(); })
              .catch(()=>{ photoCache=[]; renderPoseGrid(); renderCompareArea(); });
}
function renderPoseGrid(){
  const grid=document.getElementById("poseGrid"); if(!grid) return;
  const byPose={}; (photoCache||[]).forEach(p=>{ (byPose[p.pose]=byPose[p.pose]||[]).push(p); });
  const poses=PHOTO_LIST.filter(p=>byPose[p]&&byPose[p].length);
  if(!poses.length){ grid.style.gridTemplateColumns="1fr";
    grid.innerHTML='<div class="pcell empty-p" style="aspect-ratio:auto;padding:20px">No photos yet — add your first above to start your visual timeline.</div>'; return; }
  grid.style.gridTemplateColumns="repeat(3,1fr)";
  grid.innerHTML=poses.map(p=>{ const arr=byPose[p].slice().sort((a,b)=>a.date<b.date?-1:1); const latest=arr[arr.length-1];
    return `<button class="pcell" data-openpose="${p}"><img src="${latest.data}" alt="${p}"/><span class="cnt">${arr.length}</span><span class="plabel">${p}</span></button>`;
  }).join("");
  grid.querySelectorAll("[data-openpose]").forEach(b=>b.onclick=()=>{ progPose=b.dataset.openpose; progA=progB=null;
    const cp=document.getElementById("cmpPose"); if(cp) cp.value=progPose;
    renderCompareArea(); const cc=document.getElementById("compareCard"); if(cc) cc.scrollIntoView({behavior:"smooth",block:"start"}); });
}
function renderCompareArea(){
  const area=document.getElementById("compareArea"); if(!area) return;
  const arr=(photoCache||[]).filter(p=>p.pose===progPose).sort((a,b)=>a.date<b.date?-1:1);
  if(arr.length<2){ area.innerHTML=`<div class="empty">Add at least two “${progPose}” photos to compare.${arr.length?` You have ${arr.length} so far.`:""}</div>`; return; }
  if(!progA || !arr.some(p=>p.id===progA)) progA=arr[0].id;
  if(!progB || !arr.some(p=>p.id===progB)) progB=arr[arr.length-1].id;
  const A=arr.find(p=>p.id===progA), B=arr.find(p=>p.id===progB);
  const strip=(sel)=>arr.map(p=>`<button class="thumb ${((sel==='A'&&p.id===progA)||(sel==='B'&&p.id===progB))?'sel':''}" data-pick="${sel}:${p.id}"><img src="${p.data}"/></button>`).join("");
  area.innerHTML=`
    <div class="compare" id="cmpView">
      <img class="base" src="${A.data}" alt="before"/>
      <div class="after-wrap" id="afterWrap"><img id="afterImg" src="${B.data}" alt="after"/></div>
      <span class="tagA">${fmtDate(A.date)}</span><span class="tagB">${fmtDate(B.date)}</span>
    </div>
    <input type="range" min="0" max="100" value="55" class="compare-slider" id="cmpSlider" aria-label="reveal after photo"/>
    <div style="margin-top:12px"><div class="label" style="margin-bottom:5px">Before (purple)</div><div class="thumbstrip">${strip('A')}</div></div>
    <div style="margin-top:10px"><div class="label" style="margin-bottom:5px">After (teal)</div><div class="thumbstrip">${strip('B')}</div></div>`;
  const view=document.getElementById("cmpView"), afterImg=document.getElementById("afterImg"),
        wrap=document.getElementById("afterWrap"), slider=document.getElementById("cmpSlider");
  const sizeAfter=()=>{ afterImg.style.width=view.clientWidth+"px"; };
  const applyReveal=()=>{ wrap.style.width=slider.value+"%"; };
  if(afterImg.complete) sizeAfter(); else afterImg.onload=sizeAfter;
  applyReveal();
  slider.oninput=applyReveal;
  area.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ const [sel,id]=b.dataset.pick.split(":");
    if(sel==='A') progA=id; else progB=id; renderCompareArea(); });
}

function exLibrary(){
  const seen={}; const out=[];
  SPLIT.forEach(s=>s.ex.forEach(e=>{ if(!seen[e[0]] && e[1]!=="—" && !e[0].includes("Rest")){ seen[e[0]]=1; out.push(e);} }));
  const extra=[["Conventional Deadlift","axial load · avoid",R.r],["Barbell Back Squat","axial load · no rack",R.r],["Barbell Bent-Over Row","spinal flexion",R.r],["Good Mornings","spinal load",R.r],["Barbell RDL (heavy)","hinge under load",R.r],["Standing Barbell OHP (heavy)","axial load",R.y]];
  extra.forEach(e=>{ if(!seen[e[0]]){seen[e[0]]=1;out.push(e);} });
  const order={g:0,y:1,r:2};
  out.sort((a,b)=>order[a[2]]-order[b[2]]);
  return out.map(e=>`<div class="exlib"><span class="dot ${e[2]}"></span><span class="nm">${e[0]}</span><span class="tag">${e[1]}</span></div>`).join("");
}

function saveWorkout(){
  // strip empty sets, keep exercises that have at least one logged set OR a note
  const clean={...draft, exercises:draft.exercises.map(e=>({
    ...e, sets:e.sets.filter(s=>s.w!==""||s.r!=="")
  }))};
  const logged=clean.exercises.some(e=>e.sets.length||e.note);
  if(!logged){ toast("Log at least one set"); return; }
  // PR detection
  let prCount=0;
  clean.exercises.forEach(e=>{
    e.sets.forEach(s=>{
      const w=parseFloat(s.w), r=parseInt(s.r);
      if(w>0&&r>0){
        const est=e1rm(w,r), cur=S.prs[e.name];
        if(!cur || est>cur.e1rm){
          const rec={name:e.name,w:round1(w),r,e1rm:est,date:todayISO()};
          S.prs[e.name]=rec; S.prHistory.push(rec); prCount++;
        }
      }
    });
  });
  const idx=S.workouts.findIndex(w=>w.id===clean.id || (w.date===clean.date&&w.key===clean.key));
  if(idx>=0) S.workouts[idx]=clean; else S.workouts.push(clean);
  save();
  openCompletionSheet(clean, prCount);
  draft=null; render();
}
/* ---------- STAGE 3 sheets & helpers ---------- */
function openCompletionSheet(w, prCount){
  let totalSets=0, totalVol=0, totalReps=0; const beats=[];
  w.exercises.forEach(e=>{
    const prev=lastSessionBefore(e.name, w.id);
    let best=null;
    e.sets.forEach(s=>{
      const wt=parseFloat(s.w), r=parseInt(s.r);
      if(wt>0&&r>0){ totalSets++; totalReps+=r; totalVol+=wt*r; if(!best||e1rm(wt,r)>e1rm(best.w,best.r)) best={w:wt,r}; }
    });
    if(best && prev && prev.best && e1rm(best.w,best.r) > e1rm(prev.best.w,prev.best.r)){
      beats.push(`${e.name}: ${best.w}×${best.r} <span class="small">(was ${prev.best.w}×${prev.best.r})</span>`);
    }
  });
  const mins = w.startedAt ? Math.max(1,Math.round((Date.now()-w.startedAt)/60000)) : null;
  const html=`
    <h3 style="margin:0 0 4px">Session complete ${prCount?'🔥':'✓'}</h3>
    <p class="small" style="color:var(--ink-2);margin:0 0 14px">${w.title} · ${fmtDate(w.date)}</p>
    <div class="cs-grid">
      <div class="cs-tile"><div class="cs-n">${totalSets}</div><div class="cs-l">sets</div></div>
      <div class="cs-tile"><div class="cs-n">${Math.round(totalVol).toLocaleString()}</div><div class="cs-l">lb volume</div></div>
      <div class="cs-tile"><div class="cs-n">${totalReps}</div><div class="cs-l">reps</div></div>
      ${mins?`<div class="cs-tile"><div class="cs-n">${mins}</div><div class="cs-l">minutes</div></div>`:''}
    </div>
    ${prCount?`<div class="cs-pr">🏆 ${prCount} new personal record${prCount>1?'s':''}</div>`:''}
    ${beats.length?`<div class="cs-sec"><div class="label" style="margin-bottom:6px">Beat last time</div>${beats.map(b=>`<div class="cs-beat">▲ ${b}</div>`).join("")}</div>`:`<div class="cs-sec"><p class="small" style="color:var(--ink-2)">Logged and locked in. Consistency is the lever.</p></div>`}
    <button class="btn primary" onclick="closeSheet()" style="margin-top:14px">Done</button>`;
  showSheet(html);
}
function lastSessionBefore(name, excludeId){
  const rows=S.workouts.filter(w=>w.id!==excludeId).sort((a,b)=>a.date<b.date?1:-1);
  for(const w of rows){
    const ex=w.exercises.find(e=>e.name===name);
    if(ex){ let best=null; ex.sets.forEach(s=>{const wt=parseFloat(s.w),r=parseInt(s.r); if(wt>0&&r>0&&(!best||e1rm(wt,r)>e1rm(best.w,best.r))) best={w:wt,r};}); if(best) return {date:w.date,best}; }
  }
  return null;
}

function drawSpark(){
  const cv=document.getElementById("spark"); if(!cv) return;
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth, h=cv.clientHeight;
  cv.width=w*dpr; cv.height=h*dpr;
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  const dates=sortedWeightDates();
  if(dates.length<2){
    ctx.fillStyle="#6E7783"; ctx.font="12px -apple-system,sans-serif"; ctx.textAlign="center";
    ctx.fillText("Log two mornings to draw your trend", w/2, h/2+4); return;
  }
  const vals=dates.slice(-30).map(d=>S.weights[d]);
  const min=Math.min(...vals), max=Math.max(...vals), pad=8;
  const range=(max-min)||1;
  const X=i=>pad + i*(w-2*pad)/(vals.length-1);
  const Y=v=>h-pad-(v-min)/range*(h-2*pad);
  // area fill
  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,"rgba(139,92,246,.35)"); grad.addColorStop(1,"rgba(139,92,246,0)");
  ctx.beginPath(); ctx.moveTo(X(0),Y(vals[0]));
  vals.forEach((v,i)=>ctx.lineTo(X(i),Y(v)));
  ctx.lineTo(X(vals.length-1),h); ctx.lineTo(X(0),h); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
  // line
  ctx.beginPath(); ctx.moveTo(X(0),Y(vals[0]));
  vals.forEach((v,i)=>ctx.lineTo(X(i),Y(v)));
  ctx.strokeStyle="#8B5CF6"; ctx.lineWidth=2.4; ctx.lineJoin="round"; ctx.stroke();
  // endpoint
  const lx=X(vals.length-1), ly=Y(vals[vals.length-1]);
  ctx.beginPath(); ctx.arc(lx,ly,4,0,7); ctx.fillStyle="#2DD4BF"; ctx.fill();
  ctx.beginPath(); ctx.arc(lx,ly,7,0,7); ctx.strokeStyle="rgba(45,212,191,.4)"; ctx.lineWidth=2; ctx.stroke();
}
function drawMacros(){
  document.querySelectorAll("[data-mkey]").forEach(ring=>{
    const cv=ring.querySelector("canvas"); if(!cv) return;
    const key=ring.dataset.mkey, target=parseFloat(ring.dataset.target)||1, unit=ring.dataset.unit||"";
    const val=macroValue(key), pct=Math.max(0,Math.min(1,val/target));
    // keep center readout in sync with live typing
    const c=ring.querySelector(".c");
    if(c){ c.querySelector("b").textContent=val||0; c.querySelector("s").textContent="/ "+target+unit; }
    const ctx=cv.getContext("2d"); const s=cv.width; ctx.clearRect(0,0,s,s);
    const cx=s/2, cy=s/2, rad=s/2-14;
    const colorVar=ring.dataset.color;
    const color=getComputedStyle(document.documentElement).getPropertyValue(colorVar).trim()||"#2DD4BF";
    ctx.lineWidth=13; ctx.lineCap="round";
    ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.strokeStyle="#23272E"; ctx.stroke();
    if(pct>0){ ctx.beginPath(); ctx.arc(cx,cy,rad,-Math.PI/2,-Math.PI/2+pct*Math.PI*2);
      ctx.strokeStyle=color; ctx.stroke(); }
  });
}

/* ---------- boot ---------- */
if(!ROUTES.includes(route)) route="dash";
render();
// If localStorage looks empty but the vault has data (e.g. another same-origin
// app cleared storage), recover automatically.
if(!hasData(S) && ('indexedDB' in window)){
  vaultLoad().then(v=>{ if(hasData(v)){ S=migrate(v); save(); render(); toast("Recovered your data from on-device backup",true); } });
} else { scheduleVault(); }
window.addEventListener("resize",()=>{ if(route==="dash")drawSpark(); if(route==="fuel")drawMacros(); if(route==="progress")drawProgress(); });

/* offline indicator */
function netUpdate(announce){ const off=!navigator.onLine; document.body.classList.toggle("offline",off);
  if(announce) toast(off?"You're offline — changes save on this device":"Back online",true); }
window.addEventListener("online",()=>netUpdate(true));
window.addEventListener("offline",()=>netUpdate(true));
netUpdate(false);

/* tap the dimmed background to close the bottom sheet */
(function(){ const ov=document.getElementById("sheet-overlay"); if(ov) ov.addEventListener("click",e=>{ if(e.target===ov) closeSheet(); }); })();
</script>
<script>
/* Register SW + auto-refresh to the newest version when one is deployed.
   User data lives in localStorage/IndexedDB and is never affected by updates. */
if('serviceWorker' in navigator){
  var hadController = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(hadController && !reloaded){ reloaded = true; location.reload(); }
  });
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      if(reg.update) reg.update();               // check for a new version each launch
      setInterval(function(){ reg.update && reg.update(); }, 60*60*1000);
    }).catch(function(){});
  });
}
</script>
